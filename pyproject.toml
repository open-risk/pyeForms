[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyeforms"
version = "0.1"
dependencies = [
  "lxml",
  "xlsxwriter",
]
requires-python = ">=3.12"
authors = [
  {name = "Open Risk", email = "info@openriskmanagement.com"}
]
maintainers = [
  {name = "Open Risk", email = "info@openriskmanagement.com"}
]
description = "A simple Python tool to convert eForms notices to xlsx"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["egg", "bacon", "sausage", "tomatoes", "Lobster Thermidor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]
Homepage = "https://www.openriskmanagement.com"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/open-risk/spam.git"
Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"