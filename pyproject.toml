[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "pyeforms"
version = "0.1"
dependencies = [
  "lxml",
  "xlsxwriter",
]
requires-python = ">=3.12"
authors = [
  {name = "Open Risk", email = "info@openriskmanagement.com"}
]
maintainers = [
  {name = "Open Risk", email = "info@openriskmanagement.com"}
]
description = "A simple Python tool to convert eForms notices to xlsx"
readme = "Readme.md"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["eforms", "eprocurement", "procurement", "procurement-data", "public-procurement"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]
Homepage = "https://www.openriskmanagement.com"
Documentation = "https://www.openriskmanagement.com/documentation/pyeforms/"
Repository = "https://github.com/open-risk/pyeForms.git"
Changelog = "https://github.com/open-risk/pyeForms/blob/master/CHANGELOG.md"